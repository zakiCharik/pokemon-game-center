name: Desktop checks
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: node --check electron/main.cjs
      - run: node --check electron/preload.cjs
